<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaLiga Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1b1b1f; --muted:#6b6b76; --line:#e6e3dc;
  --c1:#1f6f5c; --cx:#b08a2e; --c2:#b3452f; --accent:#1f6f5c; --soft:#eef4f1;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121315; --card:#1b1c1f; --ink:#ecebe7; --muted:#9a9aa3; --line:#2b2c30;
    --c1:#4fb89c; --cx:#d8b25a; --c2:#e07a62; --accent:#4fb89c; --soft:#1d2a26; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 64px}
header h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:13px}
nav{display:flex;gap:6px;margin:20px 0 16px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{display:none} section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.match-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0 10px;font-weight:600;font-size:16px}
.teams .a{text-align:right}
.teams .vs{color:var(--muted);font-weight:500;font-size:13px}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:600;color:#fff}
.bar div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.b1{background:var(--c1)} .bx{background:var(--cx)} .b2{background:var(--c2)}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.row b{color:var(--ink);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.alta{background:var(--soft);color:var(--accent)}
.media{background:color-mix(in srgb,var(--cx) 15%,transparent);color:var(--cx)}
.baja{background:color-mix(in srgb,var(--muted) 15%,transparent);color:var(--muted)}
.note{font-size:12px;color:var(--cx);margin-top:6px}
.filters{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.filters label{display:flex;gap:6px;align-items:center;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted)}
h2{font-size:17px;margin:18px 0 8px}
.explain{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.tablewrap{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LaLiga Predictor</h1>
    <p id="meta">Cargando…</p>
  </header>
  <nav>
    <button data-s="jornada" class="on">Próximos partidos</button>
    <button data-s="acierto">¿Cuánto acierta?</button>
    <button data-s="equipos">Fuerza de los equipos</button>
  </nav>

  <section id="jornada" class="on">
    <div class="filters">
      <label><input type="checkbox" id="soloAlta"> Solo confianza alta (≥70%)</label>
    </div>
    <div id="partidos"></div>
  </section>

  <section id="acierto">
    <div id="bt"></div>
  </section>

  <section id="equipos">
    <p class="explain">Elo: fuerza general (1500 = media histórica). Ataque: goles que marca respecto a la media (1,20 = un 20% más). Defensa: goles que encaja respecto a la media (0,80 = un 20% menos, mejor).</p>
    <div class="card tablewrap"><table id="tabla"></table></div>
  </section>
</div>

<script>
const pct = x => (x*100).toFixed(0) + '%';
const num = x => x.toFixed(2).replace('.', ',');
const fmtDate = (d, t) => {
  if (!d) return '';
  const s = new Date(d + 'T12:00:00').toLocaleDateString('es-ES', {weekday:'short', day:'numeric', month:'short'});
  return t ? `${s} · ${t}` : s;
};
const pickName = {"1":"Gana local","X":"Empate","2":"Gana visitante"};

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === b.dataset.s));
});

async function load(name){
  const r = await fetch(`data/${name}.json?v=${Date.now()}`);
  if (!r.ok) throw new Error(name);
  return r.json();
}

function renderPartidos(data){
  const box = document.getElementById('partidos');
  const solo = document.getElementById('soloAlta').checked;
  const list = data.partidos.filter(p => !solo || p.confianza === 'alta');
  if (!list.length){
    box.innerHTML = `<div class="card empty">${data.partidos.length ? 'Ningún partido con confianza alta en esta jornada.' : 'Aún no están publicados los próximos partidos. Se actualiza solo cada día.'}</div>`;
    return;
  }
  box.innerHTML = list.map(p => {
    const w = k => Math.max(p.prob[k]*100, 0);
    const lab = k => p.prob[k] >= 0.18 ? `${k} · ${pct(p.prob[k])}` : p.prob[k] >= 0.07 ? pct(p.prob[k]) : '';
    const casas = p.casas ? `<span>Casas: <b>${pct(p.casas["1"])} · ${pct(p.casas.X)} · ${pct(p.casas["2"])}</b></span>` : '';
    const notas = p.notas.length ? `<div class="note">Ajuste manual: ${p.notas.join(' · ')}</div>` : '';
    return `<div class="card">
      <div class="match-top"><span>${fmtDate(p.fecha, p.hora)}</span>
        <span class="pill ${p.confianza}">${pickName[p.pick]} · confianza ${p.confianza}</span></div>
      <div class="teams"><span class="a">${p.local}</span><span class="vs">vs</span><span>${p.visitante}</span></div>
      <div class="bar">
        <div class="b1" style="width:${w('1')}%">${lab('1')}</div>
        <div class="bx" style="width:${w('X')}%">${lab('X')}</div>
        <div class="b2" style="width:${w('2')}%">${lab('2')}</div>
      </div>
      <div class="row">
        <span>Marcador más probable: <b>${p.marcador_probable}</b></span>
        <span>Goles esperados: <b>${num(p.goles_esperados[0])} – ${num(p.goles_esperados[1])}</b></span>
        <span>Doble oportunidad: <b>${p.doble_oportunidad.pick} ${pct(p.doble_oportunidad.prob)}</b></span>
        <span>Más de 2,5 goles: <b>${pct(p.over_2_5)}</b></span>
        ${casas}
      </div>${notas}
    </div>`;
  }).join('');
}

function renderBacktest(bt){
  const box = document.getElementById('bt');
  if (!bt.total){ box.innerHTML = '<div class="card empty">Todavía no hay datos de acierto.</div>'; return; }
  const t = bt.total;
  const seasons = Object.entries(bt.temporadas).filter(([,v]) => v);
  box.innerHTML = `
    <p class="explain">Para cada jornada de ${seasons.map(s=>s[0]).join(' y ')}, el modelo se ajustó solo con los partidos anteriores y predijo el resultado más probable. Así se mide lo que habría acertado de verdad, sin hacer trampa mirando el futuro.</p>
    <div class="stats">
      <div class="card stat"><div class="v">${pct(t.acierto)}</div><div class="l">Acierto del modelo (${t.aciertos} de ${t.partidos})</div></div>
      <div class="card stat"><div class="v">${t.acierto_casas != null ? pct(t.acierto_casas) : '—'}</div><div class="l">Acierto del favorito de las casas</div></div>
      <div class="card stat"><div class="v">${pct(t.reparto_real.X)}</div><div class="l">Partidos que acabaron en empate</div></div>
    </div>
    <h2>Acierto según la confianza</h2>
    <p class="explain">Cuanto más seguro está el modelo, más acierta, pero hay menos partidos así.</p>
    <div class="card tablewrap"><table>
      <tr><th>Probabilidad del pick</th><th>Partidos</th><th>Aciertos</th><th>% acierto</th></tr>
      ${t.por_confianza.map(b => `<tr><td>≥ ${pct(b.umbral)}</td><td>${b.partidos}</td><td>${b.aciertos}</td><td>${b.partidos ? pct(b.aciertos/b.partidos) : '—'}</td></tr>`).join('')}
    </table></div>
    <h2>Por temporada</h2>
    <div class="card tablewrap"><table>
      <tr><th>Temporada</th><th>Partidos</th><th>Modelo</th><th>Casas</th></tr>
      ${seasons.map(([s,v]) => `<tr><td>${s}</td><td>${v.partidos}</td><td>${pct(v.acierto)}</td><td>${v.acierto_casas != null ? pct(v.acierto_casas) : '—'}</td></tr>`).join('')}
    </table></div>`;
}

function renderEquipos(eq){
  document.getElementById('tabla').innerHTML =
    `<tr><th>Equipo</th><th>Elo</th><th>Ataque</th><th>Defensa</th></tr>` +
    eq.equipos.map(e => `<tr><td>${e.equipo}</td><td>${e.elo}</td><td>${num(e.ataque)}</td><td>${num(e.defensa)}</td></tr>`).join('');
}

(async () => {
  try {
    const [pred, bt, eq] = await Promise.all([load('predicciones'), load('backtest'), load('equipos')]);
    const m = pred.meta;
    const upd = new Date(m.actualizado).toLocaleString('es-ES', {dateStyle:'medium', timeStyle:'short'});
    document.getElementById('meta').textContent =
      `Temporada ${m.temporada} · ${m.partidos_historico.toLocaleString('es-ES')} partidos en el histórico · actualizado ${upd}`;
    renderPartidos(pred);
    document.getElementById('soloAlta').onchange = () => renderPartidos(pred);
    renderBacktest(bt);
    renderEquipos(eq);
  } catch (e) {
    document.getElementById('meta').textContent = 'Todavía no hay datos. La primera actualización tarda unos minutos.';
  }
})();
</script>
</body>
</html>
