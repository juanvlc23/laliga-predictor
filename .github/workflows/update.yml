name: Actualizar predicciones

on:
  schedule:
    # Horas en UTC (Madrid = UTC+2 en verano, UTC+1 en invierno).
    # De jueves a sábado, cada hora: es cuando se publican y se mueven las cuotas
    # del fin de semana, y la Quiniela suele cerrar el sábado.
    - cron: "17 * * * 4,5,6"
    # De domingo a miércoles, dos veces al día (08:17 y 19:17 en Madrid en verano).
    - cron: "17 6,17 * * 0,1,2,3"
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano
    inputs:
      prueba_aviso:
        description: "Enviar un mensaje de prueba por Telegram"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/ajustes.csv"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos y calcular predicciones
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA_AVISO: ${{ github.event.inputs.prueba_aviso }}
        run: python scripts/update.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza datos y predicciones $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
